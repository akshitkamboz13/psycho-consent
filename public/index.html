<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <link id="app-favicon" rel="icon" type="image/svg+xml" href="icons-favicons/polaroid-svgrepo-com.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Progress bar -->
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <!-- Slide stage -->
  <div id="stage"></div>

  <!-- Navigation arrows -->
  <button id="btn-back" onclick="prevSlide()" aria-label="Previous">←</button>
  <button id="btn-next" onclick="nextSlide()" aria-label="Next">→</button>

  <!-- Error hint -->
  <div id="error-hint"></div>

  <!-- PDF render area (hidden) -->
  <div id="pdf-render-area"></div>

  <script src="app.js"></script>
</body>
</html>
